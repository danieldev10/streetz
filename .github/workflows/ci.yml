name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_USER: crushclub_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U crushclub_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_TEST_DATABASE: "true"
      TEST_DATABASE_URL: postgresql://crushclub_ci:ci-only-password@127.0.0.1:55439/crushclub_ci?schema=public
      TEST_REDIS_URL: redis://127.0.0.1:16389
      DATABASE_URL: postgresql://crushclub_ci:ci-only-password@127.0.0.1:55439/crushclub_ci?schema=public
      DIRECT_URL: postgresql://crushclub_ci:ci-only-password@127.0.0.1:55439/crushclub_ci?schema=public
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run ci:prepare
      - run: npm run lint
      - name: Mandatory unit and database tests
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee ci-test-results.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-test-results
          path: apps/api/ci-test-results.txt
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      API_PROXY_TARGET: http://127.0.0.1:4000
      API_SERVER_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  ops:
    name: Operational checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm run test:ops

  required:
    name: Release checks
    if: always()
    needs: [api, web, ops]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and operational checks to pass
        env:
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          OPS_RESULT: ${{ needs.ops.result }}
        run: test "$API_RESULT" = success && test "$WEB_RESULT" = success && test "$OPS_RESULT" = success
