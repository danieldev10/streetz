# Disposable fixtures for CI reproduction. No persistent volumes or app services.
name: crushclub-ci
services:
  postgres:
    image: postgis/postgis:15-3.5
    environment:
      POSTGRES_USER: crushclub_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crushclub_ci -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
